<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deepshaft">
  <rect width="64" height="64" rx="14" fill="#0D1014"/>
  <!-- a corridor receding to a lit vanishing point: three nested frames, each dimmer than the last -->
  <rect x="8" y="8" width="48" height="48" rx="5" fill="none" stroke="#4A5A6B" stroke-width="4"/>
  <rect x="17" y="17" width="30" height="30" rx="3.5" fill="none" stroke="#8397A9" stroke-width="3.5"/>
  <rect x="25" y="25" width="14" height="14" rx="2" fill="#FFB340"/>
</svg>
